[package]
name = "remittance-stablecoin"
version = "0.1.0"
description = "Token-2022 remittance stablecoin homework"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "remittance_stablecoin"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = "0.30.1"
spl-token-2022 = "3.0.5"
spl-token-metadata-interface = "0.3.5"
spl-type-length-value = "0.4.6"
